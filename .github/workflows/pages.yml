# Publishes the app to GitHub Pages, with reports/ served next to it.
# Built fresh from map/ on every push, so the site never lags the source the way
# a committed docs/ build can. Skipped while the repository is private.
#
# One-time setup: Settings -> Pages -> Source: GitHub Actions.

name: pages

on:
  push:
    branches: [main]
    paths: ["map/**", "reports/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one but never cancels a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: map/package-lock.json

      - name: Build the app
        working-directory: map
        env:
          VITE_REPORTS: reports/
        run: |
          npm ci
          npm run build

      - name: Add the reports
        run: cp -r reports map/dist/reports

      - uses: actions/upload-pages-artifact@v4
        with:
          path: map/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
