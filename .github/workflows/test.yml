# MBTA subway reliability & ridership analytics - CS 506 final project
#
# Continuous integration: installs dependencies and runs the unit test suite.
# The tests are deliberately network-free and use synthetic fixtures, so no API
# key or downloaded data is required in CI.

name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the test suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Check every pipeline stage imports
        env:
          PYTHONPATH: src
        run: |
          python -m mbta_ds.cli --help
          python -c "from mbta_ds import clean, features, validate, model_delay, cluster_stations, viz, report; print('all stages import cleanly')"
